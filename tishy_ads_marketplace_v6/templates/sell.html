{% include "header.html" %}<main class="inner"><span class="eyebrow">CREATE A LISTING</span><h1>Sell something.<br><em>Reach buyers.</em></h1><p>Publish a real listing to the Tishy Ads marketplace.</p><form id="sellform" class="listing-form"><div class="panel"><div class="two"><label>Title<input name="title" required placeholder="e.g. iPhone 14 Pro"></label><label>Price (₦)<input name="price" type="number" required></label></div><div class="two"><label>Category<select name="category">{% for x in categories if x!="All" %}<option>{{x}}</option>{% endfor %}</select></label><label>Location<select name="location">{% for x in locations if x!="All" %}<option>{{x}}</option>{% endfor %}</select></label></div><label>Condition<select name="condition"><option>Brand New</option><option>Foreign Used</option><option>Local Used</option><option>Refurbished</option></select></label><label>Image URL (optional)<input name="image_url" placeholder="https://..."></label><label>Description<textarea name="description" required rows="8" placeholder="Describe condition, features and what is included."></textarea></label><button class="primary">Publish listing →</button></div><aside class="panel"><h3>Listing checklist</h3><p>✓ Clear title</p><p>✓ Correct category</p><p>✓ Honest condition</p><p>✓ Good photo</p><p>✓ Realistic price</p></aside></form></main>{% include "footer.html" %}
